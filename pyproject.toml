[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbehave"
version = "0.1.0"
description = "Gambling-like behavioural signatures in on-chain perpetual futures trading (Hyperliquid)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kasra Yaraei" }]
keywords = [
    "behavioral addiction",
    "problematic trading",
    "gambling disorder",
    "cryptocurrency",
    "hyperliquid",
    "perpetual futures",
    "computational psychiatry",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
harvest = ["websockets>=12"]
analysis = ["scikit-learn>=1.3", "matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "websockets>=12",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
hyperbehave = "hyperbehave.cli:main"

[project.urls]
Repository = "https://github.com/YKasra/hyperbehave"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperbehave = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
